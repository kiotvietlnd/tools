<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Code Pen của Hoàng Sơn</title>
    <!-- Tailwind CSS dựng giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phông chữ Inter từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome cho các icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Ace Editor & Plugin SearchBox -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ext-searchbox.min.js"></script>
    <style>
        /* Áp dụng phông chữ Inter mặc định */
        body {
            font-family: 'Inter', sans-serif;
            background: #fafbfc;
        }

        /* Khóa cuộn trang chính trên PC để tạo cảm giác ứng dụng chuyên nghiệp */
        @media (min-width: 1024px) {
            body, html { height: 100%; overflow: hidden; }
        }
        @media (max-width: 1023px) {
            body, html { height: auto; overflow: auto; }
        }

        /* Tùy chỉnh thanh cuộn siêu mỏng */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.45); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Đồng bộ màu sắc Ace Editor với nền Navy của Sidebar */
        .ace_editor {
            background-color: transparent !important;
            font-family: 'Fira Code', 'Courier New', Courier, monospace !important;
        }
        .ace_gutter {
            background: rgba(0, 0, 0, 0.15) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.05) !important;
            color: #64748b !important;
        }
        .ace_content { background-color: transparent !important; }

        /* ========================================================
           Thiết kế Widget Tìm kiếm gắn chặt xuống ĐÁY (Bottom Docked)
           ======================================================== */
        .ace_search {
            position: absolute !important;
            top: auto !important;
            bottom: 0 !important; /* Neo chặt dưới đáy trình soạn thảo */
            left: 0 !important;
            right: 0 !important;
            width: 100% !important; /* Chiếm 100% chiều ngang */
            max-width: 100% !important;
            height: 105px !important; /* Chiều cao cố định */
            
            background-color: #f1f5f9 !important; /* Màu xám nhạt sáng sủa */
            border: none !important;
            border-top: 3px solid #166def !important; /* Viền xanh chủ đạo bên trên */
            border-radius: 0 !important;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.1) !important;
            padding: 8px 12px !important;
            color: #0f172a !important; /* Chữ đen đậm */
            font-family: 'Inter', sans-serif !important;
            z-index: 999 !important;
            transform: none !important; 
        }
        
        .ace_search_form, .ace_replace_form {
            display: flex !important;
            align-items: center !important;
            gap: 6px !important;
            margin-bottom: 6px !important;
        }
        .ace_replace_form { margin-bottom: 0 !important; }
        
        /* Ô nhập liệu sáng, chữ đen */
        .ace_search_field {
            background-color: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #000000 !important;
            border-radius: 4px !important;
            padding: 4px 8px !important;
            font-size: 12px !important;
            font-family: 'Fira Code', monospace !important;
            width: 160px !important;
            flex-grow: 1 !important;
            min-width: 0 !important;
        }
        .ace_search_field::placeholder { color: #94a3b8 !important; }
        .ace_search_field:focus { outline: none !important; border-color: #166def !important; box-shadow: 0 0 0 2px rgba(22,109,239,0.2) !important; }
        
        /* Các nút bấm Search/Replace */
        .ace_searchbtn {
            background-color: #e2e8f0 !important;
            border: 1px solid #cbd5e1 !important;
            color: #334155 !important;
            border-radius: 4px !important;
            padding: 4px 10px !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: all 0.15s !important;
            white-space: nowrap !important;
        }
        .ace_searchbtn:hover {
            background-color: #166def !important;
            color: #ffffff !important;
            border-color: #166def !important;
        }
        
        /* Tùy chọn Regex, Case... */
        .ace_search_options {
            display: flex !important;
            gap: 4px !important;
            margin-top: 6px !important;
        }
        .ace_button {
            background-color: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #64748b !important;
            border-radius: 4px !important;
            padding: 2px 8px !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
        }
        .ace_button.checked {
            background-color: #eff6ff !important;
            color: #166def !important;
            border-color: #166def !important;
        }
        
        /* Nút Close (X) góc phải */
        .ace_searchbtn_close {
            color: #94a3b8 !important;
            position: absolute !important;
            top: 4px !important;
            right: 8px !important;
            background: transparent !important;
            border: none !important;
            cursor: pointer !important;
            padding: 4px !important;
        }
        .ace_searchbtn_close:hover { color: #ef4444 !important; background: transparent !important; }

        /* ========================================================
           Thu nhỏ chiều cao khung mã nguồn để nhường 100% chỗ cho 
           Hộp thoại tìm kiếm ở đáy (Ngăn ngừa lỗi đè chữ)
           ======================================================== */
        .ace_editor:has(.ace_search:not([style*="display: none"])) .ace_scroller,
        .ace_editor:has(.ace_search:not([style*="display: none"])) .ace_gutter,
        .ace_editor:has(.ace_search:not([style*="display: none"])) .ace_scrollbar-v {
            transform: none !important; /* Xóa bỏ lệnh đẩy xuống sai lệch */
            height: calc(100% - 105px) !important;
        }

        /* Tối ưu hóa chuyển động mượt mà khi Zoom */
        #previewIframe {
            transform-origin: top left;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        width 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, width, height;
        }
    </style>
</head>
<body class="flex flex-col h-full text-slate-700 antialiased">

    <!-- Top Navbar màu Navy ấm dịu mắt -->
    <header class="shrink-0 bg-[#243242] border-b border-[#1b2734] px-4 py-2.5 z-30 flex flex-col md:flex-row justify-between items-center gap-3 shadow-md select-none">
        <div class="flex items-center gap-3 w-full lg:w-auto justify-between lg:justify-start">
            <div class="flex items-center gap-2.5">
                <!-- Logo HS Sáng tạo -->
                <div class="relative w-8 h-8 rounded-lg bg-gradient-to-br from-[#166def] to-cyan-500 flex items-center justify-center font-extrabold text-white text-[13px] shadow-[0_3px_10px_rgba(22,109,239,0.3)] border border-white/10 select-none">
                    <span class="relative z-10">H</span>
                    <span class="relative z-10 text-cyan-200 -ml-[2px] mt-[3px]">S</span>
                    <div class="absolute inset-0.5 rounded-[6px] bg-[#243242]/20 backdrop-blur-xs z-0"></div>
                </div>
                <h1 class="text-xs font-bold text-white tracking-tight">Code Pen của Hoàng Sơn</h1>
            </div>
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse lg:hidden"></span>
        </div>
        
        <!-- Controls & Actions -->
        <div class="w-full lg:w-auto overflow-x-auto no-scrollbar py-1">
            <div class="flex flex-row flex-nowrap items-center gap-2 text-xs min-w-max">
                <button id="sidebarToggleBtn" onclick="toggleSidebar()" class="text-white hover:bg-white/20 bg-white/10 border border-white/25 px-2.5 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid fa-columns text-[#38bdf8]"></i> <span id="sidebarToggleText">Ẩn Trình gõ code</span>
                </button>
                <span class="text-white/20 select-none">|</span>
                <button onclick="loadSampleData()" class="text-white hover:bg-white/20 bg-white/10 border border-white/25 px-2.5 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid fa-cubes text-blue-300"></i> Mẫu thử
                </button>
                <label class="hover:bg-white/15 bg-white/10 text-white border border-white/15 px-2.5 py-1.5 rounded-lg font-semibold cursor-pointer transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid fa-cloud-arrow-up text-[#38bdf8]"></i> Nhập File
                    <input type="file" id="fileInput" class="hidden" accept=".html,.txt,.htm" onchange="handleFileUpload(event)">
                </label>
                <button onclick="clearEditors()" class="bg-red-500/20 hover:bg-red-500/35 text-red-200 border border-red-500/20 px-2.5 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid fa-trash-can"></i> Xóa hết
                </button>
                <span class="text-white/20 select-none">|</span>
                <div class="flex items-center gap-1.5 bg-white/10 border border-white/15 px-3 py-1.5 rounded-lg shadow-2xs">
                    <input type="checkbox" id="useJsonMock" class="w-3.5 h-3.5 text-[#166def] rounded border-white/30 focus:ring-0 cursor-pointer bg-slate-900" onchange="toggleJsonMock(this.checked)">
                    <label for="useJsonMock" class="text-white font-bold select-none cursor-pointer">Giả lập JSON</label>
                </div>
                <span class="text-white/20 select-none">|</span>
                <button id="toggleViewBtn" onclick="toggleViewport()" class="text-white hover:bg-white/10 bg-white/5 border border-white/15 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid fa-mobile-screen-button text-[#38bdf8]"></i> Di động
                </button>
                <button onclick="openInNewTab()" class="text-white hover:bg-white/15 bg-white/10 border border-white/25 px-2.5 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid fa-arrow-up-right-from-square text-indigo-300"></i> Tab mới
                </button>
                <button onclick="toggleFullscreen()" class="text-white hover:bg-white/10 bg-white/15 border border-white/15 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid fa-expand text-amber-300"></i> Full Screen
                </button>
                <button onclick="downloadOutput()" class="text-white hover:bg-[#0e5cd2] bg-[#166def] border border-blue-600 px-3 py-2 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-download"></i> Tải về
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 w-full max-w-none flex flex-col min-h-0 overflow-y-auto lg:overflow-hidden bg-[#fafbfc]">
        
        <div id="workspace" class="flex flex-col lg:flex-row flex-grow min-h-0 w-full relative">
            
            <!-- Cột trái (Sidebar) - Đã tăng lên 33.333% (1/3 Màn hình) -->
            <div id="leftSidebar" style="width: 33.333333%;" class="bg-[#243242] border-r border-[#1a2635] p-3.5 flex flex-col shrink-0 min-h-0 h-[450px] lg:h-full transition-all duration-300 select-none relative z-10">
                
                <div id="leftTabHeader" class="flex border-b border-[#1b2734] mb-2.5 text-xs font-bold hidden shrink-0">
                    <button id="tabHtmlBtn" onclick="switchLeftTab('html')" class="py-1.5 px-3 text-[#38bdf8] border-b-2 border-[#38bdf8] flex items-center gap-1.5 transition whitespace-nowrap">
                        <i class="fa-solid fa-code"></i> Mã HTML
                    </button>
                    <button id="tabJsonBtn" onclick="switchLeftTab('json')" class="py-1.5 px-3 text-slate-400 hover:text-slate-200 flex items-center gap-1.5 transition whitespace-nowrap">
                        <i class="fa-solid fa-brackets-curly"></i> Dữ liệu JSON
                    </button>
                </div>

                <div id="leftStandardHeader" class="flex justify-between items-center mb-2.5 shrink-0">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5 whitespace-nowrap">
                        <span class="w-1 h-1 bg-[#38bdf8] rounded-full"></span> TRÌNH SOẠN THẢO HTML
                    </span>
                    <div class="flex gap-2">
                        <button onclick="copyToClipboard(inputEditor)" class="text-[10px] text-[#38bdf8] hover:underline flex items-center gap-1 whitespace-nowrap">
                            <i class="fa-regular fa-copy"></i> Copy
                        </button>
                        <span class="text-slate-600">|</span>
                        <button onclick="pasteFromClipboard(inputEditor)" class="text-[10px] text-[#38bdf8] hover:underline flex items-center gap-1 whitespace-nowrap">
                            <i class="fa-regular fa-clipboard"></i> Paste
                        </button>
                    </div>
                </div>

                <!-- Tab 1: Nội dung HTML -->
                <div id="leftTabHtmlContent" class="flex-grow min-h-0 relative h-full">
                    <div id="inputEditor" class="absolute inset-0"></div>
                </div>

                <!-- Tab 2: Nội dung JSON -->
                <div id="leftTabJsonContent" class="hidden flex-grow flex flex-col h-full gap-3 min-h-0">
                    <div class="flex flex-col gap-1 shrink-0">
                        <label class="text-[9px] font-bold text-slate-300 uppercase tracking-wider">Tên tệp giả lập ảo:</label>
                        <input id="jsonFilename" type="text" value="data.json" class="bg-[#1b2734] border border-[#121c30] rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#38bdf8] font-mono text-[#38bdf8]" placeholder="data.json" oninput="runPreview()">
                    </div>
                    <div class="flex flex-col flex-grow min-h-0 relative">
                        <div class="flex justify-between items-center mb-1 shrink-0">
                            <label class="text-[9px] font-bold text-slate-300 uppercase tracking-wider whitespace-nowrap">Nội dung tệp JSON:</label>
                            <div class="flex gap-2">
                                <button onclick="copyToClipboard(jsonEditor)" class="text-[10px] text-[#38bdf8] hover:underline flex items-center gap-1 whitespace-nowrap">
                                    <i class="fa-regular fa-copy"></i> Copy
                                </button>
                                <span class="text-slate-600">|</span>
                                <button onclick="pasteFromClipboard(jsonEditor)" class="text-[10px] text-[#38bdf8] hover:underline flex items-center gap-1 whitespace-nowrap">
                                    <i class="fa-regular fa-clipboard"></i> Paste
                                </button>
                            </div>
                        </div>
                        <div class="flex-grow min-h-0 relative">
                            <div id="jsonEditor" class="absolute inset-0"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Resizer -->
            <div id="resizer" class="hidden lg:flex w-[3px] hover:w-1.5 bg-[#1b2734] hover:bg-[#166def] active:bg-[#166def] cursor-col-resize transition-all duration-150 items-center justify-center shrink-0 relative z-20 h-full"></div>

            <!-- Cột phải (Canvas) -->
            <div id="rightPreview" class="flex-grow flex flex-col min-h-0 h-[580px] lg:h-full bg-[#f1f5f9]/50 p-4 select-none">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2.5 shrink-0">
                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-1.5 whitespace-nowrap">
                        <span class="w-1.5 h-1.5 bg-[#166def] rounded-full"></span> Live Preview Canvas
                    </span>
                    
                    <!-- Nút Zoom mặc định hiển thị 80% -->
                    <div class="flex items-center gap-1.5 bg-white border border-slate-300 px-2 py-1 rounded-lg shadow-2xs text-xs mt-1 sm:mt-0">
                        <button onclick="changeZoom(-0.1)" class="w-5 h-5 rounded hover:bg-slate-100 flex items-center justify-center font-extrabold text-slate-500 transition-colors" title="Thu nhỏ">-</button>
                        <span id="zoomPercent" class="font-bold text-slate-500 w-10 text-center text-[10px]">80%</span>
                        <button onclick="changeZoom(0.1)" class="w-5 h-5 rounded hover:bg-slate-100 flex items-center justify-center font-extrabold text-slate-500 transition-colors" title="Phóng to">+</button>
                    </div>
                </div>

                <div class="flex-grow min-h-0 bg-slate-200/30 rounded-xl border border-slate-200 p-3 flex items-center justify-center relative overflow-hidden">
                    <div id="previewIframeContainer" class="w-full h-full bg-white rounded-lg overflow-hidden border border-slate-200 flex flex-col relative transition-all duration-300 shadow-xs">
                        <div id="mobileNotch" class="absolute top-3 left-1/2 -translate-x-1/2 w-28 h-6 bg-black rounded-full z-40 hidden flex items-center">
                            <div class="w-2.5 h-2.5 bg-[#0a1226] rounded-full ml-auto mr-4 border border-[#1e293b] shadow-inner"></div>
                        </div>
                        <div class="flex-grow w-full h-full relative bg-white overflow-hidden">
                            <iframe id="previewIframe" class="w-full h-full border-0 absolute inset-0"></iframe>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Logic Script -->
    <script>
        let inputEditor, jsonEditor;
        let isMobileView = false;
        let isSidebarHidden = false;
        // Đặt Zoom mặc định là 80% như yêu cầu
        let currentZoom = 0.8;

        window.addEventListener('DOMContentLoaded', () => {
            // Khởi tạo Ace Editor
            inputEditor = ace.edit("inputEditor");
            inputEditor.setTheme("ace/theme/tomorrow_night");
            inputEditor.session.setMode("ace/mode/html");
            inputEditor.setOptions({ fontSize: "13px", showPrintMargin: false, wrap: true });

            jsonEditor = ace.edit("jsonEditor");
            jsonEditor.setTheme("ace/theme/tomorrow_night");
            jsonEditor.session.setMode("ace/mode/json");
            jsonEditor.setOptions({ fontSize: "13px", showPrintMargin: false, wrap: true });

            // Ghi đè và đăng ký phím tắt Ctrl+F / Ctrl+H chuyên nghiệp
            setupAceSearchKeys(inputEditor);
            setupAceSearchKeys(jsonEditor);

            // Kích hoạt bộ dịch Tiếng Việt (Tooltip) cho Box Tìm Kiếm
            observeAndTranslateAceSearch(inputEditor);
            observeAndTranslateAceSearch(jsonEditor);

            // Tải dữ liệu mẫu
            loadSampleData();

            // Kích hoạt Update thời gian thực
            let timeout;
            const liveUpdate = () => { clearTimeout(timeout); timeout = setTimeout(runPreview, 350); };
            inputEditor.session.on('change', liveUpdate);
            jsonEditor.session.on('change', liveUpdate);

            setupResizablePanels();
        });

        // 1. Ghi đè khẩn cấp hệ thống phím tắt của Ace
        function setupAceSearchKeys(editor) {
            editor.commands.addCommand({
                name: "find",
                bindKey: {win: "Ctrl-F", mac: "Command-F"},
                exec: function(ed) {
                    ace.config.loadModule("ace/ext/searchbox", function(e) { e.Search(ed, false); });
                }
            });

            // Ép Ctrl+H thực hiện Thay thế (Replace) bất chấp trình duyệt
            editor.commands.addCommand({
                name: "replace",
                bindKey: {win: "Ctrl-H", mac: "Command-Option-F"},
                exec: function(ed) {
                    ace.config.loadModule("ace/ext/searchbox", function(e) { e.Search(ed, true); }); 
                }
            });
        }

        // 2. Observer: Nút bấm giữ tiếng Anh - Hover ra Tooltip tiếng Việt
        function observeAndTranslateAceSearch(editor) {
            editor.commands.on("afterExec", function(e) {
                if (e.command.name == "find" || e.command.name == "replace") {
                    setTimeout(() => applyTranslation(editor.container), 10);
                }
            });

            const observer = new MutationObserver(() => { applyTranslation(editor.container); });
            observer.observe(editor.container, { childList: true, subtree: true });
        }

        function applyTranslation(container) {
            const box = container.querySelector('.ace_search');
            if (!box) return;

            // Giữ Placeholders gốc tiếng Anh
            const searchInp = box.querySelector('.ace_search_form .ace_search_field');
            if (searchInp && searchInp.placeholder !== "Search for") searchInp.placeholder = "Search for";

            const replaceInp = box.querySelector('.ace_replace_form .ace_search_field');
            if (replaceInp && replaceInp.placeholder !== "Replace with") replaceInp.placeholder = "Replace with";

            // Giữ Nút bấm là tiếng Anh, nhưng Tooltip là tiếng Việt
            const btnFindAll = box.querySelector('[action="findAll"]');
            if (btnFindAll) {
                btnFindAll.textContent = "All";
                btnFindAll.title = "Tìm và bôi đen toàn bộ";
            }

            const btnReplace = box.querySelector('[action="replaceAndFindNext"]');
            if (btnReplace) {
                btnReplace.textContent = "Replace";
                btnReplace.title = "Thay thế và tìm kết quả tiếp theo";
            }

            const btnReplaceAll = box.querySelector('[action="replaceAll"]');
            if (btnReplaceAll) {
                btnReplaceAll.textContent = "All";
                btnReplaceAll.title = "Thay thế toàn bộ văn bản trùng khớp";
            }

            // Dịch Tooltips cho các nút điều hướng và Regex
            const btnNext = box.querySelector('.ace_searchbtn.next');
            if (btnNext) btnNext.title = "Kết quả tiếp theo (Enter)";

            const btnPrev = box.querySelector('.ace_searchbtn.prev');
            if (btnPrev) btnPrev.title = "Kết quả trước đó (Shift + Enter)";

            const btnHide = box.querySelector('.ace_searchbtn_close') || box.querySelector('.ace_searchbtn.close');
            if (btnHide) btnHide.title = "Đóng hộp thoại (Esc)";

            const optReg = box.querySelector('[action="toggleRegexpMode"]');
            if (optReg) optReg.title = "Tìm bằng Biểu thức chính quy (RegExp)";

            const optCase = box.querySelector('[action="toggleCaseSensitive"]');
            if (optCase) optCase.title = "Phân biệt chữ hoa / chữ thường";

            const optWord = box.querySelector('[action="toggleWholeWords"]');
            if (optWord) optWord.title = "Khớp chính xác nguyên từ (Whole Word)";

            const optSel = box.querySelector('[action="searchInSelection"]');
            if (optSel) optSel.title = "Chỉ tìm kiếm trong vùng được quét chọn";
        }

        // Thiết lập Kéo thả Sidebar Resizer
        function setupResizablePanels() {
            const leftSidebar = document.getElementById('leftSidebar');
            const resizer = document.getElementById('resizer');
            const workspace = document.getElementById('workspace');
            const previewIframe = document.getElementById('previewIframe');
            
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                previewIframe.style.pointerEvents = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const workspaceRect = workspace.getBoundingClientRect();
                const currentWidthPx = e.clientX - workspaceRect.left;
                const percent = (currentWidthPx / workspaceRect.width) * 100;

                if (percent >= 10 && percent <= 80) {
                    leftSidebar.style.width = `${percent}%`;
                    inputEditor.resize(); jsonEditor.resize();
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = 'auto';
                    previewIframe.style.pointerEvents = 'auto';
                    inputEditor.resize(); jsonEditor.resize();
                }
            });
        }

        // Ẩn/hiện Sidebar
        function toggleSidebar() {
            isSidebarHidden = !isSidebarHidden;
            const sidebar = document.getElementById('leftSidebar');
            const resizer = document.getElementById('resizer');
            const toggleText = document.getElementById('sidebarToggleText');

            if (isSidebarHidden) {
                sidebar.classList.add('hidden');
                resizer.classList.add('hidden');
                toggleText.innerText = "Hiện Trình gõ code";
            } else {
                sidebar.classList.remove('hidden');
                resizer.classList.remove('hidden');
                toggleText.innerText = "Ẩn Trình gõ code";
                inputEditor.resize(); jsonEditor.resize();
            }
        }

        // Cập nhật tỷ lệ Zoom cho Iframe mượt mà 
        function applyZoom() {
            const iframe = document.getElementById('previewIframe');
            if (iframe) {
                iframe.style.transform = `scale(${currentZoom})`;
                iframe.style.width = `${100 / currentZoom}%`;
                iframe.style.height = `${100 / currentZoom}%`;
            }
            document.getElementById('zoomPercent').innerText = `${Math.round(currentZoom * 100)}%`;
        }

        function changeZoom(factor) {
            currentZoom = Math.round((currentZoom + factor) * 10) / 10;
            if (currentZoom < 0.5) currentZoom = 0.5;
            if (currentZoom > 1.5) currentZoom = 1.5;
            applyZoom();
        }

        function loadSampleData() {
            const sampleHTML = `<!DOCTYPE html>

    <p>Bấm Ctrl + F hoặc Ctrl + H để mở hộp thoại tìm kiếm và thay thế tiếng Việt một cách dễ dàng.</p>

            const sampleJSON = {
                "author": "Hoàng Sơn",
                "message": "Dữ liệu JSON mẫu"
            };

            inputEditor.setValue(sampleHTML, -1);
            jsonEditor.setValue(JSON.stringify(sampleJSON, null, 2), -1);
            runPreview();
        }

        function toggleJsonMock(checked) {
            const tabHeader = document.getElementById('leftTabHeader');
            const standardHeader = document.getElementById('leftStandardHeader');
            if (checked) {
                tabHeader.classList.remove('hidden');
                standardHeader.classList.add('hidden');
                switchLeftTab('html');
            } else {
                tabHeader.classList.add('hidden');
                standardHeader.classList.remove('hidden');
                switchLeftTab('html');
            }
            runPreview();
        }

        function switchLeftTab(tab) {
            const tabHtmlBtn = document.getElementById('tabHtmlBtn');
            const tabJsonBtn = document.getElementById('tabJsonBtn');
            const leftTabHtmlContent = document.getElementById('leftTabHtmlContent');
            const leftTabJsonContent = document.getElementById('leftTabJsonContent');

            if (tab === 'html') {
                tabHtmlBtn.className = "py-1.5 px-3 text-[#38bdf8] border-b-2 border-[#38bdf8] flex items-center gap-1.5 transition whitespace-nowrap";
                tabJsonBtn.className = "py-1.5 px-3 text-slate-400 hover:text-slate-200 flex items-center gap-1.5 transition whitespace-nowrap";
                leftTabHtmlContent.classList.remove('hidden');
                leftTabJsonContent.classList.add('hidden');
                inputEditor.resize();
            } else {
                tabJsonBtn.className = "py-1.5 px-3 text-[#38bdf8] border-b-2 border-[#38bdf8] flex items-center gap-1.5 transition whitespace-nowrap";
                tabHtmlBtn.className = "py-1.5 px-3 text-slate-400 hover:text-slate-200 flex items-center gap-1.5 transition whitespace-nowrap";
                leftTabHtmlContent.classList.add('hidden');
                leftTabJsonContent.classList.remove('hidden');
                jsonEditor.resize();
            }
        }

        function runPreview() {
            // Đảm bảo Zoom áp dụng 80%
            applyZoom();

            const code = inputEditor.getValue();
            const useJsonMock = document.getElementById('useJsonMock').checked;
            const iframe = document.getElementById('previewIframe');

            if (!iframe) return;
            if (!useJsonMock) { iframe.srcdoc = code; return; }

            const jsonFilename = document.getElementById('jsonFilename').value.trim() || 'data.json';
            const jsonContent = jsonEditor.getValue();
            let parsedJson = {};
            try { if (jsonContent.trim() !== '') parsedJson = JSON.parse(jsonContent); } catch (e) {}

            const mockScript = 
                '<' + 'script' + '>\n' +
                '(function() {\n' +
                '    const virtualFilename = ' + JSON.stringify(jsonFilename) + ';\n' +
                '    const virtualData = ' + JSON.stringify(parsedJson) + ';\n' +
                '    const originalFetch = window.fetch;\n' +
                '    window.fetch = function(input, init) {\n' +
                '        if (typeof input === "string" && (input === virtualFilename || input.endsWith("/" + virtualFilename))) {\n' +
                '            return Promise.resolve(new Response(JSON.stringify(virtualData), {\n' +
                '                status: 200,\n' +
                '                headers: { "Content-Type": "application/json" }\n' +
                '            }));\n' +
                '        }\n' +
                '        return originalFetch.apply(this, arguments);\n' +
                '    };\n' +
                '})();\n' +
                '<' + '/script' + '>\n';

            let finalCode = code;
            if (code.includes('<head>')) { finalCode = code.replace('<head>', '<head>' + mockScript); } 
            else if (code.includes('<html>')) { finalCode = code.replace('<html>', '<html>' + mockScript); } 
            else { finalCode = mockScript + code; }

            iframe.srcdoc = finalCode; 
        }

        function toggleViewport() {
            // Khi sang Mobile Mode, vẫn giữ nguyên tỷ lệ Zoom mặc định 80% (0.8) để nhìn vừa mắt
            currentZoom = 0.8;
            applyZoom();

            isMobileView = !isMobileView;
            const container = document.getElementById('previewIframeContainer');
            const notch = document.getElementById('mobileNotch');
            const viewBtn = document.getElementById('toggleViewBtn');

            if (isMobileView) {
                // Tỉ lệ iPhone 14 Pro Max
                container.className = "w-[393px] max-w-full h-[760px] border-[12px] border-slate-900 rounded-[48px] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.45)] bg-white relative transition-all duration-300 mx-auto flex flex-col overflow-hidden my-4 shrink-0";
                notch.className = "absolute top-3 left-1/2 -translate-x-1/2 w-28 h-6 bg-black rounded-full z-40 flex items-center justify-center";
                notch.innerHTML = `<div class="w-2.5 h-2.5 bg-[#0a1226] rounded-full ml-auto mr-4 border border-[#1e293b] shadow-inner"></div>`;
                notch.classList.remove('hidden');
                viewBtn.innerHTML = `<i class="fa-solid fa-desktop text-[#38bdf8]"></i> Máy tính`;
            } else {
                container.className = "w-full h-full bg-white rounded-lg overflow-hidden border border-slate-200 flex flex-col relative transition-all duration-300";
                notch.classList.add('hidden');
                viewBtn.innerHTML = `<i class="fa-solid fa-mobile-screen-button text-[#38bdf8]"></i> Di động`;
            }
        }

        function openInNewTab() {
            const iframe = document.getElementById('previewIframe');
            if (!iframe) return;
            const code = iframe.srcdoc || inputEditor.getValue();
            const newWindow = window.open();
            if (newWindow) { newWindow.document.open(); newWindow.document.write(code); newWindow.document.close(); }
        }

        function toggleFullscreen() {
            const elem = document.getElementById('previewIframe');
            if (!elem) return;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { inputEditor.setValue(e.target.result, -1); runPreview(); };
            reader.readAsText(file);
        }

        function clearEditors() { inputEditor.setValue('', -1); jsonEditor.setValue('', -1); runPreview(); }

        function copyToClipboard(editor) {
            navigator.clipboard.writeText(editor.getValue()).then(() => alert('Đã sao chép thành công!'));
        }

        function pasteFromClipboard(editor) {
            navigator.clipboard.readText().then(text => { editor.setValue(text, -1); runPreview(); });
        }

        function downloadOutput() {
            const blob = new Blob([inputEditor.getValue()], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'output.html';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }
    </script>
