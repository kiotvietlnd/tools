<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Code Pen của Hoàng Sơn</title>
    <!-- Tailwind CSS dựng giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phông chữ Inter từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome cho các icon chuyên nghiệp -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Ace Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <style>
        /* Áp dụng phông chữ Inter */
        body {
            font-family: 'Inter', sans-serif;
            background: #fafbfc;
        }

        /* Khóa cuộn trang chính trên PC để tạo cảm giác ứng dụng chuyên nghiệp (IDE-like) */
        @media (min-width: 1024px) {
            body, html {
                height: 100%;
                overflow: hidden;
            }
        }
        @media (max-width: 1023px) {
            body, html {
                height: auto;
                overflow: auto;
            }
        }

        /* Tùy chỉnh thanh cuộn siêu mỏng */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.25);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.45);
        }

        /* Đồng bộ màu sắc Ace Editor với nền Navy của Sidebar */
        .ace_editor {
            background-color: transparent !important;
            font-family: 'Fira Code', 'Courier New', Courier, monospace !important;
            border-radius: 0.375rem;
        }
        .ace_gutter {
            background: rgba(0, 0, 0, 0.15) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.05) !important;
            color: #64748b !important;
        }
        .ace_content {
            background-color: transparent !important;
        }

        /* Ẩn thanh cuộn ngang của Navbar di động */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex flex-col h-full text-slate-600 antialiased">

    <!-- Top Navbar màu Navy ấm dịu mắt và đồng bộ -->
    <header class="shrink-0 bg-[#243242] border-b border-[#1b2734] px-4 py-2.5 z-30 flex flex-col md:flex-row justify-between items-center gap-3 shadow-md select-none">
        <!-- Brand Logo & Title -->
        <div class="flex items-center gap-3 w-full lg:w-auto justify-between lg:justify-start">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg bg-white/10 border border-white/15 flex items-center justify-center">
                    <i class="fa-solid fa-square-terminal text-white text-xs"></i>
                </div>
                <div>
                    <h1 class="text-xs font-bold text-white tracking-tight">Code Pen của Hoàng Sơn</h1>
                </div>
            </div>
            
            <!-- Trạng thái kết nối ảo -->
            <div class="flex items-center gap-1.5 bg-slate-800/40 px-2 py-0.5 rounded-md border border-slate-700/50 text-[9px] text-emerald-400 font-semibold">
                <span class="w-1 h-1 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Active</span>
            </div>
        </div>
        
        <!-- Controls & Actions -->
        <div class="flex flex-wrap items-center gap-2 text-xs w-full lg:w-auto justify-end">
            <!-- Nút Ẩn/Hiện Trình soạn thảo -->
            <button onclick="toggleSidebar()" class="bg-white/10 hover:bg-white/15 text-white border border-white/15 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs" title="Ẩn hoặc hiện khung soạn thảo trái">
                <i class="fa-solid fa-columns text-[#38bdf8]"></i>
                <span id="sidebarToggleText">Ẩn Trình gõ code</span>
            </button>

            <span class="text-white/10 hidden lg:inline">|</span>

            <!-- Nút nạp dữ liệu mẫu -->
            <button onclick="loadSampleData()" class="bg-white/10 hover:bg-white/15 text-white border border-white/15 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs" title="Tải dữ liệu mẫu">
                <i class="fa-solid fa-cubes text-blue-300"></i> Mẫu thử
            </button>
            <!-- Nhập file từ thiết bị -->
            <label class="hover:bg-white/15 bg-white/10 text-white border border-white/15 px-3 py-1.5 rounded-lg font-semibold cursor-pointer transition flex items-center gap-1.5 shadow-2xs" title="Tải file HTML/TXT lên">
                <i class="fa-solid fa-cloud-arrow-up text-[#38bdf8]"></i> Nhập File
                <input type="file" id="fileInput" class="hidden" accept=".html,.txt,.htm" onchange="handleFileUpload(event)">
            </label>
            <!-- Xóa sạch -->
            <button onclick="clearEditors()" class="bg-red-500/20 hover:bg-red-500/35 text-red-200 border border-red-500/20 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs" title="Xóa dữ liệu">
                <i class="fa-solid fa-trash-can"></i> Xóa hết
            </button>
            
            <span class="text-white/10 hidden lg:inline">|</span>
            
            <!-- Checkbox sử dụng JSON giả lập -->
            <div class="flex items-center gap-1.5 bg-white/10 border border-white/15 px-3 py-1.5 rounded-lg shadow-2xs">
                <input type="checkbox" id="useJsonMock" class="w-3.5 h-3.5 text-[#166def] rounded border-white/30 focus:ring-0 cursor-pointer bg-slate-900" onchange="toggleJsonMock(this.checked)">
                <label for="useJsonMock" class="text-white font-bold select-none cursor-pointer">Giả lập JSON</label>
            </div>
            
            <span class="text-white/10 hidden lg:inline">|</span>

            <!-- Chế độ di động -->
            <button id="toggleViewBtn" onclick="toggleViewport()" class="bg-white/10 hover:bg-white/15 text-white border border-white/15 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                <i class="fa-solid fa-mobile-screen-button text-[#38bdf8]"></i> Di động
            </button>
            <!-- Mở sang Tab độc lập -->
            <button onclick="openInNewTab()" class="bg-white/10 hover:bg-white/15 text-white border border-white/15 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                <i class="fa-solid fa-arrow-up-right-from-square text-indigo-300"></i> Tab mới
            </button>
            <!-- Toàn màn hình -->
            <button onclick="toggleFullscreen()" class="bg-white/10 hover:bg-white/15 text-white border border-white/15 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                <i class="fa-solid fa-expand text-amber-300"></i> Full Screen
            </button>
            <!-- Tải xuống file .html -->
            <button onclick="downloadOutput()" class="bg-[#166def] hover:bg-blue-600 text-white border border-blue-600 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-md">
                <i class="fa-solid fa-download"></i> Tải về
            </button>
        </div>
    </header>

    <!-- Main Workspace (Loại bỏ padding ngoài để Sidebar sát mép hoàn toàn trên PC) -->
    <main class="flex-1 w-full max-w-none flex flex-col min-h-0 overflow-y-auto lg:overflow-hidden bg-[#fafbfc]">
        
        <!-- Workspace Flexbox -->
        <div id="workspace" class="flex flex-col lg:flex-row flex-grow min-h-0 w-full relative">
            
            <!-- Cột trái (Sidebar): Thiết kế phẳng Navy mượt mà, ôm trọn khung hình bên trái -->
            <div id="leftSidebar" class="bg-[#243242] border-r border-[#1a2635] p-3.5 flex flex-col shrink-0 min-h-0 w-full lg:w-1/5 h-[450px] lg:h-full transition-[width] duration-75 select-none">
                <!-- Tiêu đề / Tab Headers (Chỉ xuất hiện khi tích chọn Giả lập JSON) -->
                <div id="leftTabHeader" class="flex border-b border-[#1b2734] mb-2.5 text-xs font-bold hidden shrink-0">
                    <button id="tabHtmlBtn" onclick="switchLeftTab('html')" class="py-1.5 px-3 text-[#38bdf8] border-b-2 border-[#38bdf8] flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-code"></i> Mã HTML
                    </button>
                    <button id="tabJsonBtn" onclick="switchLeftTab('json')" class="py-1.5 px-3 text-slate-400 hover:text-slate-200 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-brackets-curly"></i> Dữ liệu JSON
                    </button>
                </div>

                <!-- Tiêu đề tiêu chuẩn khi không sử dụng JSON -->
                <div id="leftStandardHeader" class="flex justify-between items-center mb-2.5 shrink-0">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                        <span class="w-1 h-1 bg-[#38bdf8] rounded-full"></span> Trình soạn thảo HTML
                    </span>
                    <div class="flex gap-2">
                        <button onclick="copyToClipboard(inputEditor)" class="text-[10px] text-[#38bdf8] hover:underline flex items-center gap-1">
                            <i class="fa-regular fa-copy"></i> Copy
                        </button>
                        <span class="text-slate-500">|</span>
                        <button onclick="pasteFromClipboard(inputEditor)" class="text-[10px] text-[#38bdf8] hover:underline flex items-center gap-1">
                            <i class="fa-regular fa-clipboard"></i> Paste
                        </button>
                    </div>
                </div>

                <!-- Tab 1: Nội dung HTML -->
                <div id="leftTabHtmlContent" class="flex-grow min-h-0 relative h-full">
                    <div id="inputEditor" class="absolute inset-0 overflow-hidden"></div>
                </div>

                <!-- Tab 2: Nội dung JSON -->
                <div id="leftTabJsonContent" class="hidden flex-grow flex flex-col h-full gap-3">
                    <div class="flex flex-col gap-1 shrink-0">
                        <label class="text-[9px] font-bold text-slate-300 uppercase tracking-wider">Tên tệp giả lập ảo:</label>
                        <input id="jsonFilename" type="text" value="data.json" class="bg-[#1b2734] border border-[#121c30] rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#38bdf8] font-mono text-[#38bdf8]" placeholder="data.json" oninput="runPreview()">
                    </div>
                    <div class="flex flex-col flex-grow min-h-0 relative">
                        <div class="flex justify-between items-center mb-1 shrink-0">
                            <label class="text-[9px] font-bold text-slate-300 uppercase tracking-wider">Nội dung tệp JSON:</label>
                            <div class="flex gap-2">
                                <button onclick="copyToClipboard(jsonEditor)" class="text-[10px] text-[#38bdf8] hover:underline flex items-center gap-1">
                                    <i class="fa-regular fa-copy"></i> Copy
                                </button>
                                <span class="text-slate-500">|</span>
                                <button onclick="pasteFromClipboard(jsonEditor)" class="text-[10px] text-[#38bdf8] hover:underline flex items-center gap-1">
                                    <i class="fa-regular fa-clipboard"></i> Paste
                                </button>
                            </div>
                        </div>
                        <div class="flex-grow min-h-0 relative">
                            <div id="jsonEditor" class="absolute inset-0 overflow-hidden"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Rãnh phân tách kéo thả siêu mảnh (Chỉ khả dụng trên Desktop) -->
            <div id="resizer" class="hidden lg:flex w-[3px] hover:w-1.5 bg-slate-200/80 hover:bg-[#166def] active:bg-[#166def] cursor-col-resize transition-all duration-150 items-center justify-center shrink-0 relative z-20 h-full"></div>

            <!-- Cột phải (Canvas): Vùng đệm xám nhạt cao cấp giúp nổi bật tệp thiết kế -->
            <div id="rightPreview" class="flex-grow flex flex-col min-h-0 h-[580px] lg:h-full bg-[#f1f5f9]/50 p-4 transition-all duration-300">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2.5 shrink-0 select-none">
                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 bg-[#166def] rounded-full"></span> Live Preview Canvas
                    </span>
                </div>

                <!-- Thể hiện Frame hiển thị mượt mà -->
                <div class="flex-grow min-h-0 bg-white rounded-xl border border-slate-200 overflow-hidden relative shadow-xs">
                    
                    <!-- Khung Browser/Mobile Mockup -->
                    <div id="previewIframeContainer" class="w-full h-full relative transition-all duration-300">
                        <!-- Thanh tai thỏ (Chỉ hiển thị ở chế độ di động) -->
                        <div id="mobileNotch" class="absolute top-1.5 left-1/2 -translate-x-1/2 w-24 h-4 bg-slate-800 rounded-full z-30 hidden"></div>
                        
                        <!-- Iframe thực thi kết quả (Loại bỏ hoàn toàn các thanh địa chỉ rườm rà) -->
                        <div class="w-full h-full relative bg-white">
                            <iframe id="previewIframe" class="w-full h-full border-0 absolute inset-0"></iframe>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Logic Script -->
    <script>
        let inputEditor, jsonEditor;
        let isMobileView = false;
        let isSidebarHidden = false;

        // Khởi động khi ứng dụng tải xong cấu trúc DOM
        window.addEventListener('DOMContentLoaded', () => {
            // Khởi tạo Editor nhập liệu HTML
            inputEditor = ace.edit("inputEditor");
            inputEditor.setTheme("ace/theme/tomorrow_night");
            inputEditor.session.setMode("ace/mode/html");
            inputEditor.setOptions({
                fontSize: "13px",
                showPrintMargin: false,
                wrap: true
            });

            // Khởi tạo Editor nhập liệu JSON
            jsonEditor = ace.edit("jsonEditor");
            jsonEditor.setTheme("ace/theme/tomorrow_night");
            jsonEditor.session.setMode("ace/mode/json");
            jsonEditor.setOptions({
                fontSize: "13px",
                showPrintMargin: false,
                wrap: true
            });

            // Tải dữ liệu mẫu mặc định
            loadSampleData();

            // Trình lắng nghe thay đổi nội dung (Thời gian thực)
            let timeout;
            const liveUpdate = () => {
                clearTimeout(timeout);
                timeout = setTimeout(runPreview, 350); 
            };

            inputEditor.session.on('change', liveUpdate);
            jsonEditor.session.on('change', liveUpdate);

            // Cấu hình tính năng kéo thả thay đổi kích thước rãnh Resizer
            setupResizablePanels();
        });

        // Hàm thiết lập tính năng Kéo thả điều chỉnh tỷ lệ chiều rộng
        function setupResizablePanels() {
            const leftSidebar = document.getElementById('leftSidebar');
            const resizer = document.getElementById('resizer');
            const workspace = document.getElementById('workspace');
            const previewIframe = document.getElementById('previewIframe');
            
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                // Tạm thời vô hiệu hóa bắt sự kiện của Iframe để di chuột không bị nghẽn
                previewIframe.style.pointerEvents = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                
                const workspaceRect = workspace.getBoundingClientRect();
                const currentWidthPx = e.clientX - workspaceRect.left;
                const percent = (currentWidthPx / workspaceRect.width) * 100;

                // Khống chế biên an toàn từ 10% đến 80% độ rộng màn hình
                if (percent >= 10 && percent <= 80) {
                    leftSidebar.style.width = `${percent}%`;
                    inputEditor.resize();
                    jsonEditor.resize();
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = 'auto';
                    previewIframe.style.pointerEvents = 'auto';
                    inputEditor.resize();
                    jsonEditor.resize();
                }
            });
        }

        // Hàm ẩn hoàn toàn nội dung gõ code bên trái để tăng không gian preview
        function toggleSidebar() {
            isSidebarHidden = !isSidebarHidden;
            const sidebar = document.getElementById('leftSidebar');
            const resizer = document.getElementById('resizer');
            const toggleText = document.getElementById('sidebarToggleText');

            if (isSidebarHidden) {
                sidebar.classList.add('hidden');
                resizer.classList.add('hidden');
                toggleText.innerText = "Hiện Trình gõ code";
            } else {
                sidebar.classList.remove('hidden');
                resizer.classList.remove('hidden');
                toggleText.innerText = "Ẩn Trình gõ code";
                
                // Đồng bộ vẽ lại Editor
                inputEditor.resize();
                jsonEditor.resize();
            }
        }

        // Hàm tải dữ liệu mẫu và dữ liệu JSON giả lập
        function loadSampleData() {
            // Thiết kế giao diện Light Theme công nghệ vui nhộn
            const sampleHTML = `<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 50%, #f0f7ff, #ffffff);
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 35px 30px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1.5px solid #dbeafe;
      box-shadow: 0 10px 40px rgba(22, 109, 239, 0.05);
      max-width: 360px;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #166def, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 12px 0;
      letter-spacing: -0.02em;
    }
    p {
      color: #475569;
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .tech-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      color: #166def;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 18px;
      border: 1px solid #bfdbfe;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #166def;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(22, 109, 239, 0.5);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }
    .glow-btn {
      background: linear-gradient(135deg, #166def, #3b82f6);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(22, 109, 239, 0.3);
      transition: all 0.3s;
    }
    .glow-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(22, 109, 239, 0.45);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tech-badge">
      <span class="pulse-dot"></span> Online Sandbox
    </div>
    <h1>Code Pen của Hoàng Sơn</h1>
    <p>Không gian sáng tạo và biên dịch mã nguồn trực tuyến tốc độ cao, hỗ trợ kiểm nghiệm responsive và mô phỏng JSON dynamic một cách nhanh chóng nhất.</p>
    <button class="glow-btn" onclick="alert('Hãy bắt đầu chỉnh sửa code ở cột bên trái để cảm nhận sự khác biệt! 🚀')">Khám phá ngay</button>
  </div>
</body>
</html>`;

            const sampleJSON = {
                "author": "Hoàng Sơn",
                "status": "Online",
                "message": "Dữ liệu giả lập từ tệp JSON đã được nạp thành công vào môi trường sandbox!"
            };

            inputEditor.setValue(sampleHTML, -1);
            jsonEditor.setValue(JSON.stringify(sampleJSON, null, 2), -1);
            runPreview();
        }

        // Bật/tắt tính năng Giả lập JSON
        function toggleJsonMock(checked) {
            const tabHeader = document.getElementById('leftTabHeader');
            const standardHeader = document.getElementById('leftStandardHeader');
            if (checked) {
                tabHeader.classList.remove('hidden');
                standardHeader.classList.add('hidden');
                switchLeftTab('html');
            } else {
                tabHeader.classList.add('hidden');
                standardHeader.classList.remove('hidden');
                switchLeftTab('html');
            }
            runPreview();
        }

        // Chuyển đổi tab bên trái giữa HTML và JSON (Chỉnh màu text chủ đạo sang tông sáng trên nền Navy)
        function switchLeftTab(tab) {
            const tabHtmlBtn = document.getElementById('tabHtmlBtn');
            const tabJsonBtn = document.getElementById('tabJsonBtn');
            const leftTabHtmlContent = document.getElementById('leftTabHtmlContent');
            const leftTabJsonContent = document.getElementById('leftTabJsonContent');

            if (tab === 'html') {
                tabHtmlBtn.className = "py-1.5 px-3 text-[#38bdf8] border-b-2 border-[#38bdf8] flex items-center gap-1.5 transition";
                tabJsonBtn.className = "py-1.5 px-3 text-slate-400 hover:text-slate-200 flex items-center gap-1.5 transition";
                leftTabHtmlContent.classList.remove('hidden');
                leftTabJsonContent.classList.add('hidden');
                inputEditor.resize();
            } else {
                tabJsonBtn.className = "py-1.5 px-3 text-[#38bdf8] border-b-2 border-[#38bdf8] flex items-center gap-1.5 transition";
                tabHtmlBtn.className = "py-1.5 px-3 text-slate-400 hover:text-slate-200 flex items-center gap-1.5 transition";
                leftTabHtmlContent.classList.add('hidden');
                leftTabJsonContent.classList.remove('hidden');
                jsonEditor.resize();
            }
        }

        // Tự động nạp mã nguồn vào iframe
        function runPreview() {
            const code = inputEditor.getValue();
            const useJsonMock = document.getElementById('useJsonMock').checked;
            const iframe = document.getElementById('previewIframe');

            if (!iframe) return;

            // Nếu không chọn Giả lập JSON, thực thi mã nguồn HTML thuần khiết nhất
            if (!useJsonMock) {
                iframe.srcdoc = code;
                return;
            }

            const jsonFilename = document.getElementById('jsonFilename').value.trim() || 'data.json';
            const jsonContent = jsonEditor.getValue();

            // Xử lý dữ liệu JSON an toàn
            let parsedJson = {};
            try {
                if (jsonContent.trim() !== '') {
                    parsedJson = JSON.parse(jsonContent);
                }
            } catch (e) {
                console.warn("Dữ liệu JSON chưa đúng định dạng.");
            }

            // Kỹ thuật nối chuỗi an toàn tránh lỗi đứt đoạn HTML Parser của trình duyệt chính
            const mockScript = 
                '<' + 'script' + '>\n' +
                '(function() {\n' +
                '    const virtualFilename = ' + JSON.stringify(jsonFilename) + ';\n' +
                '    const virtualData = ' + JSON.stringify(parsedJson) + ';\n' +
                '    const originalFetch = window.fetch;\n' +
                '    window.fetch = function(input, init) {\n' +
                '        if (typeof input === "string" && (input === virtualFilename || input.endsWith("/" + virtualFilename))) {\n' +
                '            return Promise.resolve(new Response(JSON.stringify(virtualData), {\n' +
                '                status: 200,\n' +
                '                headers: { "Content-Type": "application/json" }\n' +
                '            }));\n' +
                '        }\n' +
                '        return originalFetch.apply(this, arguments);\n' +
                '    };\n' +
                '    const originalOpen = XMLHttpRequest.prototype.open;\n' +
                '    XMLHttpRequest.prototype.open = function(method, url) {\n' +
                '        if (typeof url === "string" && (url === virtualFilename || url.endsWith("/" + virtualFilename))) {\n' +
                '            this._isMocked = true;\n' +
                '        } else {\n' +
                '            this._isMocked = false;\n' +
                '        }\n' +
                '        return originalOpen.apply(this, arguments);\n' +
                '    };\n' +
                '    const originalSend = XMLHttpRequest.prototype.send;\n' +
                '    XMLHttpRequest.prototype.send = function(body) {\n' +
                '        if (this._isMocked) {\n' +
                '            Object.defineProperty(this, "readyState", { writable: true, value: 4 });\n' +
                '            Object.defineProperty(this, "status", { writable: true, value: 200 });\n' +
                '            Object.defineProperty(this, "responseText", { writable: true, value: JSON.stringify(virtualData) });\n' +
                '            Object.defineProperty(this, "response", { writable: true, value: JSON.stringify(virtualData) });\n' +
                '            if (typeof this.onreadystatechange === "function") {\n' +
                '                this.onreadystatechange();\n' +
                '            }\n' +
                '            if (typeof this.onload === "function") {\n' +
                '                this.onload();\n' +
                '            }\n' +
                '        } else {\n' +
                '            return originalSend.apply(this, arguments);\n' +
                '        }\n' +
                '    };\n' +
                '    window.jsonData = virtualData;\n' +
                '    window[virtualFilename.replace(".json", "")] = virtualData;\n' +
                '})();\n' +
                '<' + '/script' + '>\n';

            // Tiêm mã giả lập ảo vào phần đầu của Iframe để chạy ưu tiên
            let finalCode = code;
            if (code.includes('<head>')) {
                finalCode = code.replace('<head>', '<head>' + mockScript);
            } else if (code.includes('<html>')) {
                finalCode = code.replace('<html>', '<html>' + mockScript);
            } else {
                finalCode = mockScript + code;
            }

            iframe.srcdoc = finalCode; 
        }

        // Chuyển đổi giữa chế độ View di động (375px) và View toàn màn hình PC
        function toggleViewport() {
            isMobileView = !isMobileView;
            const container = document.getElementById('previewIframeContainer');
            const notch = document.getElementById('mobileNotch');
            const viewBtn = document.getElementById('toggleViewBtn');

            if (isMobileView) {
                // Chuyển sang kích thước điện thoại dọc
                container.className = "w-[375px] max-w-full h-[520px] border-[12px] border-slate-800 rounded-[36px] shadow-2xl bg-white relative transition-all duration-300 mx-auto flex flex-col overflow-hidden my-4";
                notch.classList.remove('hidden');
                viewBtn.innerHTML = `<i class="fa-solid fa-desktop"></i> Máy tính`;
            } else {
                // Chuyển lại màn hình máy tính đầy đủ
                container.className = "w-full h-full bg-white rounded-lg overflow-hidden border border-slate-200 flex flex-col relative transition-all duration-300";
                notch.classList.add('hidden');
                viewBtn.innerHTML = `<i class="fa-solid fa-mobile-screen-button"></i> Di động`;
            }
        }

        // Mở kết quả sang tab mới
        function openInNewTab() {
            const iframe = document.getElementById('previewIframe');
            if (!iframe) return;

            const code = iframe.srcdoc || inputEditor.getValue();
            const newWindow = window.open();
            if (newWindow) {
                newWindow.document.open();
                newWindow.document.write(code);
                newWindow.document.close();
            } else {
                alert("Trình duyệt chặn mở liên kết bật lên (popup). Vui lòng cấp quyền hiển thị popup đối với trang này để sử dụng.");
            }
        }

        // Phóng to toàn màn hình khung Iframe
        function toggleFullscreen() {
            const elem = document.getElementById('previewIframe');
            if (!elem) return;

            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                }
            }
        }

        // Đọc dữ liệu tải lên
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                inputEditor.setValue(e.target.result, -1);
                runPreview();
            };
            reader.readAsText(file);
        }

        // Dọn sạch mã nguồn nhập liệu
        function clearEditors() {
            inputEditor.setValue('', -1);
            jsonEditor.setValue('', -1);
            runPreview();
        }

        // Sao chép mã nguồn
        function copyToClipboard(editor) {
            const text = editor.getValue();
            navigator.clipboard.writeText(text).then(() => {
                alert('Đã sao chép nội dung thành công!');
            }).catch(err => {
                console.error('Không thể sao chép: ', err);
            });
        }

        // Dán từ clipboard máy tính vào khung soạn thảo đang hoạt động
        function pasteFromClipboard(editor) {
            navigator.clipboard.readText()
                .then(text => {
                    editor.setValue(text, -1);
                    runPreview();
                })
                .catch(err => {
                    alert("Không thể dán tự động. Vui lòng cấp quyền truy cập clipboard hoặc sử dụng phím tắt (Ctrl+V / Cmd+V).");
                });
        }

        // Tải xuống mã nguồn HTML
        function downloadOutput() {
            const code = inputEditor.getValue();
            const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'output.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
