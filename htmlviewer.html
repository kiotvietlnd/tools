<!DOCTYPE html>
<html lang="vi" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Pen của Hoàng Sơn</title>
    <!-- Tailwind CSS dựng giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phông chữ Inter từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome cho các icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Ace Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <style>
        /* Áp dụng phông chữ Inter mặc định và chặn cuộn trang chính */
        body, html {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(at top left, #f8fafc, #f1f5f9, #f8fafc);
        }

        /* Tùy chỉnh thanh cuộn siêu mỏng */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(22, 109, 239, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(22, 109, 239, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(22, 109, 239, 0.4);
        }

        /* Hiệu ứng kính mờ có đường viền sắc nét, rõ ràng */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #cbd5e1; /* Nâng cao độ tương phản viền */
            box-shadow: 0 4px 15px rgba(22, 109, 239, 0.02);
            transition: all 0.25s ease-in-out;
        }
        .glass-panel:hover {
            border-color: #166def; /* Chuyển sang màu xanh chủ đạo khi tương tác */
            box-shadow: 0 4px 20px rgba(22, 109, 239, 0.06);
        }

        /* Định hình viền rõ nét cho các Ace Editor */
        #inputEditor, #jsonEditor {
            border: 1px solid #cbd5e1 !important;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="flex flex-col h-full text-slate-700">

    <!-- Top Navbar tinh giản tích hợp toàn bộ các tác vụ -->
    <header class="shrink-0 bg-white/85 backdrop-blur-md border-b border-slate-300 px-4 py-2.5 z-10 flex flex-col md:flex-row justify-between items-center gap-3">
        <!-- Brand -->
        <div class="flex items-center gap-2 select-none">
            <div class="w-7 h-7 rounded-lg bg-[#166def] flex items-center justify-center shadow-[0_2px_8px_rgba(22,109,239,0.25)]">
                <i class="fa-solid fa-code text-white text-xs"></i>
            </div>
            <h1 class="text-xs font-bold text-slate-800 tracking-tight flex items-center gap-1.5">
                Code Pen của Hoàng Sơn
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            </h1>
        </div>
        
        <!-- Controls & Actions với các đường viền rõ nét -->
        <div class="flex flex-wrap items-center gap-2 text-xs">
            <!-- Nút nạp dữ liệu mẫu -->
            <button onclick="loadSampleData()" class="text-slate-600 hover:text-[#166def] bg-white border border-slate-300 hover:border-[#166def] px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs" title="Tải dữ liệu mẫu">
                <i class="fa-solid fa-cubes text-blue-500"></i> Mẫu thử
            </button>
            <!-- Nhập file từ thiết bị -->
            <label class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 hover:border-[#166def] px-3 py-1.5 rounded-lg font-semibold cursor-pointer transition flex items-center gap-1.5 shadow-2xs" title="Tải file HTML/TXT lên">
                <i class="fa-solid fa-cloud-arrow-up text-[#166def]"></i> Nhập File
                <input type="file" id="fileInput" class="hidden" accept=".html,.txt,.htm" onchange="handleFileUpload(event)">
            </label>
            <!-- Xóa sạch -->
            <button onclick="clearEditors()" class="bg-red-50/60 hover:bg-red-100/50 text-red-600 border border-red-300/80 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs" title="Xóa dữ liệu">
                <i class="fa-solid fa-trash-can"></i> Xóa
            </button>
            
            <span class="text-slate-300 hidden sm:inline">|</span>
            
            <!-- Checkbox sử dụng JSON giả lập -->
            <div class="flex items-center gap-1.5 bg-white border border-slate-300 px-3 py-1.5 rounded-lg shadow-2xs">
                <input type="checkbox" id="useJsonMock" class="w-3.5 h-3.5 text-[#166def] rounded border-slate-300 focus:ring-[#166def] cursor-pointer" onchange="toggleJsonMock(this.checked)">
                <label for="useJsonMock" class="text-slate-600 font-bold select-none cursor-pointer">Giả lập JSON</label>
            </div>
            
            <span class="text-slate-300 hidden sm:inline">|</span>

            <!-- Chế độ di động -->
            <button id="toggleViewBtn" onclick="toggleViewport()" class="text-slate-600 hover:text-[#166def] bg-white border border-slate-300 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                <i class="fa-solid fa-mobile-screen-button text-slate-400"></i> Di động
            </button>
            <!-- Mở sang Tab độc lập -->
            <button onclick="openInNewTab()" class="text-[#166def] hover:text-blue-800 bg-blue-50/50 border border-blue-200 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Tab mới
            </button>
            <!-- Toàn màn hình -->
            <button onclick="toggleFullscreen()" class="text-orange-600 hover:text-orange-800 bg-orange-50/50 border border-orange-200 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                <i class="fa-solid fa-expand"></i> Full Screen
            </button>
            <!-- Tải xuống file .html -->
            <button onclick="downloadOutput()" class="text-emerald-600 hover:text-emerald-800 bg-emerald-50/50 border border-emerald-200 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-2xs">
                <i class="fa-solid fa-download"></i> Tải về
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 w-full max-w-none px-4 pb-4 pt-3 flex flex-col min-h-0 overflow-hidden">
        
        <!-- Khung chia tỷ lệ 1/5 và 4/5 -->
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-4 flex-grow min-h-0">
            
            <!-- Cột trái (1/5): Trình nhập mã nguồn / dữ liệu JSON ảo -->
            <div class="glass-panel p-3 rounded-xl flex flex-col lg:col-span-1 overflow-hidden min-h-0 h-full">
                <!-- Tiêu đề / Tab Headers (Chỉ xuất hiện khi tích chọn Giả lập JSON) -->
                <div id="leftTabHeader" class="flex border-b border-slate-200 mb-2 text-xs font-bold hidden shrink-0">
                    <button id="tabHtmlBtn" onclick="switchLeftTab('html')" class="py-1.5 px-3 text-[#166def] border-b-2 border-[#166def] flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-code"></i> Mã HTML
                    </button>
                    <button id="tabJsonBtn" onclick="switchLeftTab('json')" class="py-1.5 px-3 text-slate-400 hover:text-slate-600 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-brackets-curly"></i> Dữ liệu JSON
                    </button>
                </div>

                <!-- Tiêu đề tiêu chuẩn khi không sử dụng JSON -->
                <div id="leftStandardHeader" class="flex justify-between items-center mb-2 shrink-0 select-none">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <span class="w-1 h-1 bg-[#166def] rounded-full"></span> Trình soạn thảo HTML
                    </span>
                    <button onclick="copyToClipboard(inputEditor)" class="text-[10px] text-[#166def] hover:underline flex items-center gap-1">
                        <i class="fa-regular fa-copy"></i> Sao chép
                    </button>
                </div>

                <!-- Tab 1: Nội dung HTML -->
                <div id="leftTabHtmlContent" class="flex-grow min-h-0 relative h-full">
                    <div id="inputEditor" class="absolute inset-0 overflow-hidden"></div>
                </div>

                <!-- Tab 2: Nội dung JSON -->
                <div id="leftTabJsonContent" class="hidden flex-grow flex flex-col h-full gap-3 min-h-0">
                    <div class="flex flex-col gap-1 shrink-0">
                        <label class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Tên tệp giả lập ảo:</label>
                        <input id="jsonFilename" type="text" value="data.json" class="border border-slate-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#166def] font-mono text-[#166def]" placeholder="data.json" oninput="runPreview()">
                    </div>
                    <div class="flex flex-col flex-grow min-h-0 relative">
                        <div class="flex justify-between items-center mb-1 shrink-0">
                            <label class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Nội dung tệp JSON:</label>
                            <button onclick="copyToClipboard(jsonEditor)" class="text-[10px] text-[#166def] hover:underline flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Sao chép
                            </button>
                        </div>
                        <div class="flex-grow min-h-0 relative">
                            <div id="jsonEditor" class="absolute inset-0 overflow-hidden"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cột phải (4/5): Màn hình xem trực quan (Hỗ trợ Device Emulator) -->
            <div class="glass-panel p-3 rounded-xl flex flex-col lg:col-span-4 overflow-hidden min-h-0 h-full">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2 shrink-0 select-none">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <span class="w-1 h-1 bg-emerald-500 rounded-full"></span> Giao diện xem trước (Live Preview)
                    </span>
                </div>

                <!-- Vùng chứa Frame mô phỏng có đệm lề -->
                <div class="flex-grow min-h-0 bg-slate-100/40 rounded-lg border border-slate-300 p-3 flex items-center justify-center relative">
                    
                    <!-- Khung Browser/Mobile Mockup -->
                    <div id="previewIframeContainer" class="w-full h-full bg-white rounded-lg overflow-hidden border border-slate-300 flex flex-col relative transition-all duration-300">
                        <!-- Thanh tai thỏ (Chỉ hiển thị ở chế độ di động) -->
                        <div id="mobileNotch" class="absolute top-1.5 left-1/2 -translate-x-1/2 w-24 h-4 bg-slate-800 rounded-full z-30 hidden"></div>
                        
                        <!-- Thanh mô phỏng thanh địa chỉ trình duyệt -->
                        <div id="browserHeader" class="bg-slate-50 border-b border-slate-300 px-4 py-1.5 flex items-center gap-2 shrink-0 select-none">
                            <div class="flex gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-slate-200 border border-slate-300/40"></span>
                                <span class="w-2 h-2 rounded-full bg-slate-200 border border-slate-300/40"></span>
                                <span class="w-2 h-2 rounded-full bg-slate-200 border border-slate-300/40"></span>
                            </div>
                            <div class="bg-white border border-slate-300 text-[9px] text-slate-400 px-3 py-0.5 rounded flex-grow mx-4 text-center truncate">
                                <i class="fa-solid fa-lock text-[8px] mr-1 text-emerald-500"></i> codepen.hoangson.sandbox
                            </div>
                            <button onclick="runPreview()" class="text-slate-400 hover:text-slate-600 transition" title="Làm mới"><i class="fa-solid fa-rotate-right text-[10px]"></i></button>
                        </div>
                        
                        <!-- Iframe thực thi kết quả -->
                        <div class="flex-grow w-full h-full relative bg-white">
                            <iframe id="previewIframe" class="w-full h-full border-0 absolute inset-0"></iframe>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Logic Script -->
    <script>
        let inputEditor, jsonEditor;
        let isMobileView = false;

        // Khởi động khi ứng dụng tải xong cấu trúc DOM
        window.addEventListener('DOMContentLoaded', () => {
            // Khởi tạo Editor nhập liệu HTML
            inputEditor = ace.edit("inputEditor");
            inputEditor.setTheme("ace/theme/chrome");
            inputEditor.session.setMode("ace/mode/html");
            inputEditor.setOptions({
                fontSize: "13px",
                showPrintMargin: false,
                wrap: true
            });

            // Khởi tạo Editor nhập liệu JSON
            jsonEditor = ace.edit("jsonEditor");
            jsonEditor.setTheme("ace/theme/chrome");
            jsonEditor.session.setMode("ace/mode/json");
            jsonEditor.setOptions({
                fontSize: "13px",
                showPrintMargin: false,
                wrap: true
            });

            // Tải dữ liệu mẫu mặc định
            loadSampleData();

            // Trình lắng nghe thay đổi nội dung (Thời gian thực)
            let timeout;
            const liveUpdate = () => {
                clearTimeout(timeout);
                timeout = setTimeout(runPreview, 350); 
            };

            inputEditor.session.on('change', liveUpdate);
            jsonEditor.session.on('change', liveUpdate);
        });

        // Hàm tải dữ liệu mẫu và dữ liệu JSON giả lập
        function loadSampleData() {
            // Mã nguồn chào mừng giao diện SÁNG, phong cách công nghệ vui nhộn
            const sampleHTML = `<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 50%, #f0f7ff, #ffffff);
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 35px 30px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1.5px solid #dbeafe;
      box-shadow: 0 10px 40px rgba(22, 109, 239, 0.05);
      max-width: 360px;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #166def, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 12px 0;
      letter-spacing: -0.02em;
    }
    p {
      color: #475569;
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .tech-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      color: #166def;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 18px;
      border: 1px solid #bfdbfe;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #166def;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(22, 109, 239, 0.5);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }
    .glow-btn {
      background: linear-gradient(135deg, #166def, #3b82f6);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(22, 109, 239, 0.3);
      transition: all 0.3s;
    }
    .glow-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(22, 109, 239, 0.45);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tech-badge">
      <span class="pulse-dot"></span> Online Sandbox
    </div>
    <h1>Code Pen của Hoàng Sơn</h1>
    <p>Không gian sáng tạo và biên dịch mã nguồn trực tuyến tốc độ cao, hỗ trợ kiểm nghiệm responsive và mô phỏng JSON dynamic một cách nhanh chóng nhất.</p>
    <button class="glow-btn" onclick="alert('Hãy bắt đầu chỉnh sửa code ở cột bên trái để cảm nhận sự khác biệt! 🚀')">Khám phá ngay</button>
  </div>
</body>
</html>`;

            const sampleJSON = {
                "author": "Hoàng Sơn",
                "status": "Online",
                "message": "Dữ liệu giả lập từ tệp JSON đã được nạp thành công vào môi trường sandbox!"
            };

            inputEditor.setValue(sampleHTML, -1);
            jsonEditor.setValue(JSON.stringify(sampleJSON, null, 2), -1);
            runPreview();
        }

        // Bật/tắt tính năng Giả lập JSON
        function toggleJsonMock(checked) {
            const tabHeader = document.getElementById('leftTabHeader');
            const standardHeader = document.getElementById('leftStandardHeader');
            if (checked) {
                tabHeader.classList.remove('hidden');
                standardHeader.classList.add('hidden');
                switchLeftTab('html');
            } else {
                tabHeader.classList.add('hidden');
                standardHeader.classList.remove('hidden');
                switchLeftTab('html');
            }
            runPreview();
        }

        // Chuyển đổi tab bên trái giữa HTML và JSON
        function switchLeftTab(tab) {
            const tabHtmlBtn = document.getElementById('tabHtmlBtn');
            const tabJsonBtn = document.getElementById('tabJsonBtn');
            const leftTabHtmlContent = document.getElementById('leftTabHtmlContent');
            const leftTabJsonContent = document.getElementById('leftTabJsonContent');

            if (tab === 'html') {
                tabHtmlBtn.className = "py-1.5 px-3 text-[#166def] border-b-2 border-[#166def] flex items-center gap-1.5 transition";
                tabJsonBtn.className = "py-1.5 px-3 text-slate-400 hover:text-slate-600 flex items-center gap-1.5 transition";
                leftTabHtmlContent.classList.remove('hidden');
                leftTabJsonContent.classList.add('hidden');
                inputEditor.resize();
            } else {
                tabJsonBtn.className = "py-1.5 px-3 text-[#166def] border-b-2 border-[#166def] flex items-center gap-1.5 transition";
                tabHtmlBtn.className = "py-1.5 px-3 text-slate-400 hover:text-slate-600 flex items-center gap-1.5 transition";
                leftTabHtmlContent.classList.add('hidden');
                leftTabJsonContent.classList.remove('hidden');
                jsonEditor.resize();
            }
        }

        // Tự động nạp mã nguồn vào iframe
        function runPreview() {
            const code = inputEditor.getValue();
            const useJsonMock = document.getElementById('useJsonMock').checked;
            const iframe = document.getElementById('previewIframe');

            if (!iframe) return;

            // Nếu không chọn Giả lập JSON, thực thi mã nguồn HTML thuần khiết nhất
            if (!useJsonMock) {
                iframe.srcdoc = code;
                return;
            }

            const jsonFilename = document.getElementById('jsonFilename').value.trim() || 'data.json';
            const jsonContent = jsonEditor.getValue();

            // Xử lý dữ liệu JSON an toàn
            let parsedJson = {};
            try {
                if (jsonContent.trim() !== '') {
                    parsedJson = JSON.parse(jsonContent);
                }
            } catch (e) {
                console.warn("Dữ liệu JSON chưa đúng định dạng.");
            }

            // Kỹ thuật nối chuỗi an toàn tránh lỗi đứt đoạn HTML Parser của trình duyệt chính
            const mockScript = 
                '<' + 'script' + '>\n' +
                '(function() {\n' +
                '    const virtualFilename = ' + JSON.stringify(jsonFilename) + ';\n' +
                '    const virtualData = ' + JSON.stringify(parsedJson) + ';\n' +
                '    const originalFetch = window.fetch;\n' +
                '    window.fetch = function(input, init) {\n' +
                '        if (typeof input === "string" && (input === virtualFilename || input.endsWith("/" + virtualFilename))) {\n' +
                '            return Promise.resolve(new Response(JSON.stringify(virtualData), {\n' +
                '                status: 200,\n' +
                '                headers: { "Content-Type": "application/json" }\n' +
                '            }));\n' +
                '        }\n' +
                '        return originalFetch.apply(this, arguments);\n' +
                '    };\n' +
                '    const originalOpen = XMLHttpRequest.prototype.open;\n' +
                '    XMLHttpRequest.prototype.open = function(method, url) {\n' +
                '        if (typeof url === "string" && (url === virtualFilename || url.endsWith("/" + virtualFilename))) {\n' +
                '            this._isMocked = true;\n' +
                '        } else {\n' +
                '            this._isMocked = false;\n' +
                '        }\n' +
                '        return originalOpen.apply(this, arguments);\n' +
                '    };\n' +
                '    const originalSend = XMLHttpRequest.prototype.send;\n' +
                '    XMLHttpRequest.prototype.send = function(body) {\n' +
                '        if (this._isMocked) {\n' +
                '            Object.defineProperty(this, "readyState", { writable: true, value: 4 });\n' +
                '            Object.defineProperty(this, "status", { writable: true, value: 200 });\n' +
                '            Object.defineProperty(this, "responseText", { writable: true, value: JSON.stringify(virtualData) });\n' +
                '            Object.defineProperty(this, "response", { writable: true, value: JSON.stringify(virtualData) });\n' +
                '            if (typeof this.onreadystatechange === "function") {\n' +
                '                this.onreadystatechange();\n' +
                '            }\n' +
                '            if (typeof this.onload === "function") {\n' +
                '                this.onload();\n' +
                '            }\n' +
                '        } else {\n' +
                '            return originalSend.apply(this, arguments);\n' +
                '        }\n' +
                '    };\n' +
                '    window.jsonData = virtualData;\n' +
                '    window[virtualFilename.replace(".json", "")] = virtualData;\n' +
                '})();\n' +
                '<' + '/script' + '>\n';

            // Tiêm mã giả lập ảo vào phần đầu của Iframe để chạy ưu tiên
            let finalCode = code;
            if (code.includes('<head>')) {
                finalCode = code.replace('<head>', '<head>' + mockScript);
            } else if (code.includes('<html>')) {
                finalCode = code.replace('<html>', '<html>' + mockScript);
            } else {
                finalCode = mockScript + code;
            }

            iframe.srcdoc = finalCode; 
        }

        // Chuyển đổi giữa chế độ View di động (375px) và View toàn màn hình PC
        function toggleViewport() {
            isMobileView = !isMobileView;
            const container = document.getElementById('previewIframeContainer');
            const notch = document.getElementById('mobileNotch');
            const browserHeader = document.getElementById('browserHeader');
            const viewBtn = document.getElementById('toggleViewBtn');

            if (isMobileView) {
                // Chuyển sang kích thước điện thoại dọc 
                container.className = "w-[375px] h-[550px] border-[12px] border-slate-800 rounded-[36px] shadow-2xl bg-white relative transition-all duration-300 mx-auto flex flex-col overflow-hidden my-4";
                notch.classList.remove('hidden');
                browserHeader.classList.add('hidden'); // Ẩn thanh browser bar khi chuyển sang di động
                viewBtn.innerHTML = `<i class="fa-solid fa-desktop"></i> Máy tính`;
                viewBtn.className = "text-xs text-[#166def] hover:text-blue-700 bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-sm";
            } else {
                // Chuyển lại màn hình máy tính đầy đủ
                container.className = "w-full h-full bg-white rounded-lg overflow-hidden border border-slate-300 flex flex-col relative transition-all duration-300";
                notch.classList.add('hidden');
                browserHeader.classList.remove('hidden');
                viewBtn.innerHTML = `<i class="fa-solid fa-mobile-screen-button"></i> Di động`;
                viewBtn.className = "text-xs text-slate-600 hover:text-[#166def] bg-white border border-slate-300 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 shadow-xs";
            }
        }

        // Mở kết quả sang tab mới
        function openInNewTab() {
            const iframe = document.getElementById('previewIframe');
            if (!iframe) return;

            const code = iframe.srcdoc || inputEditor.getValue();
            const newWindow = window.open();
            if (newWindow) {
                newWindow.document.open();
                newWindow.document.write(code);
                newWindow.document.close();
            } else {
                alert("Trình duyệt chặn mở liên kết bật lên (popup). Vui lòng cấp quyền hiển thị popup đối với trang này để sử dụng.");
            }
        }

        // Phóng to toàn màn hình khung Iframe
        function toggleFullscreen() {
            const elem = document.getElementById('previewIframe');
            if (!elem) return;

            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                }
            }
        }

        // Đọc dữ liệu tải lên
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                inputEditor.setValue(e.target.result, -1);
                runPreview();
            };
            reader.readAsText(file);
        }

        // Dọn sạch mã nguồn nhập liệu
        function clearEditors() {
            inputEditor.setValue('', -1);
            jsonEditor.setValue('', -1);
            runPreview();
        }

        // Sao chép mã nguồn
        function copyToClipboard(editor) {
            const text = editor.getValue();
            navigator.clipboard.writeText(text).then(() => {
                alert('Đã sao chép nội dung thành công!');
            }).catch(err => {
                console.error('Không thể sao chép: ', err);
            });
        }

        // Tải xuống mã nguồn HTML
        function downloadOutput() {
            const code = inputEditor.getValue();
            const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'output.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
