    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Fallback background */
            overflow: hidden; /* Prevent body scrolling for app-like layout */
            color: #334155; /* slate-700 */
        }

        /* Custom Scrollbar for Sidebar */
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: transparent; }
        #sidebar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        #sidebar::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Soft Glow & Gradient Foundation */
        @keyframes moveInCircle { 0% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
        @keyframes moveVertical { 0% { transform: translateY(-50%); } 50% { transform: translateY(50%); } 100% { transform: translateY(-50%); } }
        @keyframes moveHorizontal { 0% { transform: translateX(-50%); } 50% { transform: translateX(50%); } 100% { transform: translateX(-50%); } }
        
        .soft-glow-background { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -10; 
            background: linear-gradient(to bottom right, #f8fafc, #e0f2fe); 
        }
        .soft-glow-background .shape { position: absolute; filter: blur(140px); opacity: 0.25; }
        .soft-glow-background .shape1 { height: 350px; width: 350px; background: #166def; border-radius: 50%; top: -50px; left: -100px; animation: moveInCircle 22s ease-in-out infinite; }
        .soft-glow-background .shape2 { height: 450px; width: 450px; background: #16a34a; border-radius: 50%; bottom: -100px; right: -100px; animation: moveVertical 28s ease-in-out infinite; }
        .soft-glow-background .shape3 { height: 300px; width: 500px; background: #f97316; border-radius: 50%; top: 50%; left: 50%; animation: moveHorizontal 35s ease-in-out infinite; }

        /* Component Styles */
        .kv-blue { color: #166def; }
        .bg-kv-blue { background-color: #166def; }
        .hover\:bg-kv-blue-dark:hover { background-color: #0a58ca; }
        .border-kv-blue { border-color: #166def; }
        .ring-kv-blue:focus { --tw-ring-color: #166def; }
        
        /* Sidebar Button Active State */
        .website-button.active {
            background-color: #166def !important; /* kv-blue */
            border-color: #166def !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px -2px rgba(22, 109, 239, 0.3);
        }
        .website-button.active .button-name { color: white !important; }
        .website-button.active .button-category { color: #dbeafe !important; } /* blue-100 */

        /* Navbar Filter Active State */
        .navbar-filter-btn.active {
            background-color: #166def; /* kv-blue */
            color: white;
            box-shadow: 0 2px 8px -1px rgba(22, 109, 239, 0.2);
        }

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            AOS.init({ once: true, duration: 600, easing: 'ease-out-cubic', offset: 50 });

            // Apply common styles to navbar filter buttons
            document.querySelectorAll('.navbar-filter-btn').forEach(btn => {
                btn.classList.add('px-4', 'py-2', 'rounded-lg', 'text-sm', 'font-semibold', 'transition-all', 'duration-200', 'flex', 'items-center', 'text-slate-600', 'bg-white/60', 'hover:bg-blue-100', 'hover:text-kv-blue');
            });

             // Apply common styles to float nav buttons
            document.querySelectorAll('.float-nav-btn').forEach(btn => {
                btn.classList.add('w-12', 'h-12', 'bg-kv-blue', 'text-white', 'rounded-full', 'flex', 'items-center', 'justify-center', 'shadow-lg', 'transition-all', 'duration-300', 'hover:scale-110', 'hover:bg-kv-blue-dark');
            });
            
            // Populate the sidebar from the master list
            const masterListContainer = document.getElementById('full-list-container');
            const allButtons = Array.from(masterListContainer.children);

            allButtons.forEach(button => {
                const category = button.dataset.category;
                const section = document.querySelector(`#sidebar .industry-section[data-category="${category}"] .space-y-3`);
                if (section) {
                    const clonedButton = button.cloneNode(true);
                    clonedButton.classList.add(
                        'website-button', 'block', 'w-full', 'text-left', 'p-4', 'rounded-xl', 'bg-slate-50', 'hover:bg-blue-100',
                        'transition-all', 'duration-200', 'cursor-pointer', 'border', 'border-slate-200', 'hover:border-blue-400'
                    );
                    clonedButton.querySelector('.button-name').classList.add('font-semibold', 'text-slate-800', 'text-base', 'transition-colors');
                    clonedButton.querySelector('.button-category').classList.add('text-sm', 'text-slate-500', 'mt-1', 'transition-colors');
                    // Hide the URL part in the sidebar
                    clonedButton.querySelector('.button-url').classList.add('hidden');
                    section.appendChild(clonedButton);
                }
            });
            masterListContainer.remove(); // Clean up master list from DOM

            // Add Keyboard navigation
            document.addEventListener('keydown', handleKeyboardNav);

            // Initial view setup
            updateVisibleWebsites();
        });

        function loadUrl(url, element) {
            document.getElementById('websiteFrame').src = url;
            const urlLink = document.getElementById('currentUrlLink');
            urlLink.href = url;
            urlLink.querySelector('#currentUrlDisplay').textContent = url.replace(/^(https?:\/\/)?(www\.)?/, '').replace(/\/$/, "");;
            
            document.querySelectorAll('#sidebar .website-button.active').forEach(activeBtn => {
                activeBtn.classList.remove('active');
            });
            if(element) {
                element.classList.add('active');
            }
        }
        
        function handleFilterClick(category, element) {
            document.querySelectorAll('.navbar-filter-btn.active').forEach(activeBtn => activeBtn.classList.remove('active'));
            element.classList.add('active');
            updateVisibleWebsites();
        }
        
        function updateVisibleWebsites() {
            const activeFilter = document.querySelector('.navbar-filter-btn.active').dataset.category;
            const searchTerm = document.getElementById('searchBar').value.toLowerCase().trim();
            
            document.querySelectorAll('#sidebar .website-button').forEach(button => {
                const buttonCategory = button.dataset.category;
                const buttonName = button.dataset.name.toLowerCase();
                const buttonDetails = button.dataset.details.toLowerCase();

                const categoryMatch = (activeFilter === 'all' || buttonCategory === activeFilter);
                const searchMatch = (buttonName.includes(searchTerm) || buttonDetails.includes(searchTerm));
                
                button.style.display = (categoryMatch && searchMatch) ? 'block' : 'none';
            });
            
            updateSectionVisibility();
            selectFirstWebsite();
        }

        function updateSectionVisibility() {
            document.querySelectorAll('#sidebar .industry-section').forEach(section => {
                const visibleButtons = section.querySelectorAll('.website-button:not([style*="display: none"])');
                section.style.display = visibleButtons.length > 0 ? 'block' : 'none';
            });
        }
        
        function selectFirstWebsite() {
            const firstVisibleButton = document.querySelector('#sidebar .website-button:not([style*="display: none"])');
            if (firstVisibleButton) {
                firstVisibleButton.click();
            } else {
                document.getElementById('websiteFrame').src = 'about:blank';
                const urlLink = document.getElementById('currentUrlLink');
                urlLink.href = '#';
                urlLink.querySelector('#currentUrlDisplay').textContent = 'Không tìm thấy kết quả phù hợp.';
            }
        }

        function navigateWebsites(direction) {
            const visibleButtons = Array.from(document.querySelectorAll('#sidebar .website-button:not([style*="display: none"])'));
            if (visibleButtons.length < 2) return;

            const activeButton = document.querySelector('#sidebar .website-button.active');
            let currentIndex = visibleButtons.indexOf(activeButton);

            let nextIndex;
            if (direction === 'down') {
                nextIndex = currentIndex + 1;
                if (nextIndex >= visibleButtons.length) nextIndex = 0; // Loop to top
            } else { // 'up'
                nextIndex = currentIndex - 1;
                if (nextIndex < 0) nextIndex = visibleButtons.length - 1; // Loop to bottom
            }
            
            const nextButton = visibleButtons[nextIndex];
            if (nextButton) {
                nextButton.click();
                nextButton.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function handleKeyboardNav(event) {
            // Prevent navigation when user is typing in the search bar
            if (document.activeElement === document.getElementById('searchBar')) {
                return;
            }

            if (event.key === 'ArrowDown') {
                event.preventDefault();
                navigateWebsites('down');
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                navigateWebsites('up');
            }
        }
    </script>
